<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img id="avatar" class="profile-avatar" src="https://via.placeholder.com/180x180" alt="Profile Avatar">
            <h1 id="name" class="profile-name">Carregando...</h1>
            <h2 id="username" class="profile-username">@</h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repos">0</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers">0</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following">0</span>
                </li>
            </ul>
            <a id="link" href="#" class="profile-link">Ver no Github</a>
            <p id="error-message" class="error-message"></p>
        </div>
    </header>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const nameElement = document.querySelector('#name');
            const usernameElement = document.querySelector('#username');
            const avatarElement = document.querySelector('#avatar');
            const reposElement = document.querySelector('#repos');
            const followersElement = document.querySelector('#followers');
            const followingElement = document.querySelector('#following');
            const linkElement = document.querySelector('#link');
            const errorElement = document.querySelector('#error-message');

            try {
                const response = await fetch('https://api.github.com/users/mariahlmiranda');
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const data = await response.json();

                nameElement.innerText = data.name || 'Nome não disponível';
                usernameElement.innerText = `@${data.login}`;
                avatarElement.src = data.avatar_url;
                followingElement.innerText = data.following;
                followersElement.innerText = data.followers;
                reposElement.innerText = data.public_repos;
                linkElement.href = data.html_url;

            } catch (error) {
                errorElement.innerText = `Falha ao carregar dados do GitHub: ${error.message}`;
                console.error('Erro na requisição:', error);
            }
        });
    </script>
</body>
</html>
